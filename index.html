<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Scan this QR code to improve your front-end development skills with Frontend Mentor's coding challenges. Perfect for developers looking to enhance their portfolio."
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link
      rel="canonical"
      href="https://frontendmentor.newbie.qr-code-component.joao-carvalho.dev/"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://frontendmentor.newbie.qr-code-component.joao-carvalho.dev/"
    />
    <meta property="og:title" content="Frontend Mentor | QR Code Component" />
    <meta
      property="og:description"
      content="Scan this QR code to improve your front-end development skills with Frontend Mentor's coding challenges."
    />
    <meta property="og:image" content="./assets/images/image-qr-code.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:url"
      content="https://frontendmentor.newbie.qr-code-component.joao-carvalho.dev/"
    />
    <meta
      property="twitter:title"
      content="Frontend Mentor | QR Code Component"
    />
    <meta
      property="twitter:description"
      content="Scan this QR code to improve your front-end development skills with Frontend Mentor's coding challenges."
    />
    <meta
      property="twitter:image"
      content="./assets/images/image-qr-code.png"
    />

    <link rel="stylesheet" href="./css/style.css" />

    <title>Frontend Mentor | QR code component</title>
  </head>
  <body>
    <main>
      <img
        class="qr-code-image"
        src="./assets/images/image-qr-code.png"
        alt="QR code pointing to frontendmentor.io"
        width="288"
        height="288"
        loading="eager"
      />

      <h1 class="title">Improve your front-end skills by building projects</h1>

      <p class="description">
        Scan the QR code to visit Frontend Mentor and take your coding skills to
        the next level
      </p>
    </main>

    <footer>
      <p>
        Coded by
        <a href="https://www.joao-carvalho.dev/" target="_blank">joaoc-dev</a>.
      </p>
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
          >Frontend Mentor</a
        >.
      </p>
    </footer>
  </body>
</html>
